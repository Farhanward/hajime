# wf-shell: the panel and the background.
#
# A separate file from wayfire.ini because they are separate programs. wayfire
# is the compositor; wf-panel and wf-background are two clients it starts, and
# they read this. Putting the wallpaper path in wayfire.ini -- which is where
# people look first -- silently does nothing.
#
# Install as ~/.config/wf-shell.ini

[background]
# The wallpaper is installed under a name with no resolution in it, so a
# re-render at another size does not leave this pointing at a file that is gone.
image = /usr/local/share/hajime/wallpaper.png

# The art is drawn at exactly 1920x1080 on a pixel grid. Any fill mode that
# scales it by a fraction destroys that grid -- the whole picture goes soft and
# every hard edge grows a grey twin. On this panel the image lands 1:1.
fill_mode = preserve_aspect

# One picture, no rotation. A wallpaper that changes every ten minutes is a
# wallpaper nobody recognises the machine by.
cycle_timeout = 0

[panel]
# Along the bottom, as on the machine this desktop is drawn after.
position = bottom
autohide = false
minimal_height = 34

# Left of the panel: the launcher menu, then the pinned applications. Their
# labels come from the .desktop files in /usr/local/share/applications, which
# carry Name and Name[ar] both -- so the panel is in Arabic when the session is,
# and nothing here has to know that.
widgets_left = menu launchers window-list
widgets_right = network volume clock

launchers_size = 26
launchers_spacing = 6
launcher_terminal = hajime-terminal.desktop
launcher_files = hajime-files.desktop
launcher_console = hajime-console.desktop

# 24-hour, because the machine's logs are and reading two clocks in two formats
# is how an hour goes missing.
clock_format = %H:%M  ·  %a %d %b
clock_font = VT323 14

menu_icon = /usr/local/share/hajime/mark-32.png
menu_size = 26
