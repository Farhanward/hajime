# Hajime desktop — wayfire configuration.
#
# wayfire rather than a compositor written from scratch: FreeBSD ships it as a
# binary package, it stacks windows the way a CRT-framed desktop needs, and its
# plugin system is where the scanline layer belongs. Writing one would have
# been months for the same picture.
#
# Install:
#   pkg install drm-kmod gpu-firmware-intel-kabylake seatd wayfire wf-shell
#   sysrc kld_list="i915kms"
#   sysrc seatd_enable="YES"
#
# The firmware package is the part people miss. Without it the driver loads but
# no display appears, and the failure reads as a driver problem.

[core]
# Only what the desktop needs. Every plugin costs memory on an 8 GB host, and
# the cube and wobbly-window plugins are decoration on decoration.
plugins = \
    autostart \
    command \
    decoration \
    expo \
    grid \
    move \
    place \
    resize \
    vswitch \
    window-rules

# One workspace row. A server desktop is opened to look at something, not to
# live in.
vwidth = 2
vheight = 1

# From hajime-brand/out/wayfire.colors, which is printed from palette.toml.
# It is the same navy the wallpaper fades to, so a workspace with no
# wallpaper yet is the same colour as one that has it.
background_color = 0.043 0.055 0.122 1.0
close_top_view = <super> KEY_Q

[autostart]
# The panel and the background, from wf-shell. Both read ~/.config/wf-shell.ini,
# which is where the wallpaper path lives -- not here.
panel = wf-panel
background = wf-background

# The splash, once, while the session comes up. Guarded on imv being present:
# the picture is installed either way, and a session that fails to start because
# a viewer is missing is a worse trade than a session that starts without a
# splash.
splash = sh -c 'command -v imv >/dev/null 2>&1 && timeout 4 imv -f -x /usr/local/share/hajime/splash-1920x1080.png >/dev/null 2>&1; true'

# The console is the point of the desktop: open it on login.
console = sh -c 'sleep 3; xdg-open http://127.0.0.1:8088/ || true'

[decoration]
# Window frames in the system's palette: a rust title bar on a beige body with a
# near-black edge. The three colours are Farhan's, and the floats below are
# printed from them by hajime-brand/tools/emit.py -- converting a hex to a float
# by hand is how the decorations end up a shade off the windows they frame.
title_height = 26
border_size = 4
active_color    = 0.698 0.475 0.345 1.0
inactive_color  = 0.490 0.310 0.220 1.0
font = VT323 13

[place]
# New windows centred: with two workspaces and few windows, cascading only
# makes them harder to find.
mode = center

[grid]
# Halves and quarters by keyboard. The mouse is often not present on a server.
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_t = <super> KEY_UP
slot_b = <super> KEY_DOWN
slot_c = <super> KEY_ENTER

[expo]
toggle = <super> KEY_E

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[vswitch]
binding_left = <super> KEY_H
binding_right = <super> KEY_L

[command]
binding_terminal = <super> KEY_T
command_terminal = xterm

binding_console = <super> KEY_C
command_console = xdg-open http://127.0.0.1:8088/

[window-rules]
# The console opens maximised: it is a dashboard, not a document.
rule_console = on created if app_id contains "hajime" then maximize

[input]
# Arabic alongside English, toggled with both shifts.
#
# This is the keyboard only. Which language the desktop *speaks* is the locale's
# business and is set in /etc/login.conf, the same way every other system does
# it -- not by painting Arabic into the theme.
xkb_layout = us,ara
xkb_options = grp:shifts_toggle
