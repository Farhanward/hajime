[package]
name = "hajime-sys"
version.workspace = true
edition.workspace = true

[[bin]]
name = "hajimectl"
path = "src/main.rs"

[lib]
name = "hajime_sys"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
