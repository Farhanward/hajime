# Hajime jails.
#
# Three jails on a cloned loopback, with pf translating their outbound traffic.
# Not VNET: a full virtual network stack per jail costs memory and a routing
# setup to debug, and nothing here needs its own firewall or its own routing
# table. Alias addresses on lo1 give each jail its own address, which is all
# the isolation the split actually depends on.
#
# Install as /etc/jail.conf. Create the jails first:
#
#   sh create_jails.sh
#
# Then, on the host:
#
#   sysrc jail_enable="YES"
#   service jail start
#
# Each jail root is its own ZFS dataset, which is the point. To update the
# model without risking the sites:
#
#   hajimectl jail-snapshot ai before-model-swap
#   ... do the work ...
#   hajimectl jail-rollback ai <the snapshot it printed>

# --- defaults, applied to every jail below --------------------------------

# The jail's own rc, so services inside come up and go down with the jail.
exec.start = "/bin/sh /etc/rc";
exec.stop  = "/bin/sh /etc/rc.shutdown jail";
exec.clean;
exec.consolelog = "/var/log/jail_${name}_console.log";

mount.devfs;
# The default devfs ruleset for jails: no disks, no kmem, no pf device. A jail
# that can open /dev/mem is not a jail.
devfs_ruleset = 4;

host.hostname = "${name}.hajime.local";
path = "/jails/${name}";

interface = "lo1";
ip4.addr = "10.99.0.${addr}";

# Off by default and named per jail only where needed. raw sockets are what
# ping wants and also what a compromised process wants.
allow.raw_sockets = false;
allow.set_hostname = false;
allow.sysvipc = false;
allow.chflags = false;

# System V shared memory, per jail rather than shared with the host. Postgres
# needs it; leaving it host-wide would let one jail see another's segments.
sysvmsg = new;
sysvsem = new;
sysvshm = new;

# --- web: the exposed one --------------------------------------------------
# Public sites and the PHP store. Everything that gets broken into gets broken
# into here, so nothing else lives with it.
web {
    $addr = "10";
    # PHP and Caddy both fork per request; the default limit is generous but a
    # runaway here must not take the host down with it.
    exec.poststart = "logger -t hajime jail web started";
}

# --- data: reachable from the other jails, never from outside --------------
data {
    $addr = "20";
    # Postgres wants more shared memory than the default, and it is the only
    # thing here that does.
    allow.sysvipc = true;
}

# --- ai: the model ---------------------------------------------------------
# llama.cpp and the gateway. Jailed because a model that can be talked into
# calling a tool should not be talking to a host shell. Its outbound reach is
# cut in pf: the model fetches nothing on its own, the gateway does the
# fetching and the gateway logs it.
ai {
    $addr = "30";
    # A model load is a long mmap of a multi-gigabyte file. Everything else in
    # this jail is small.
    exec.poststart = "logger -t hajime jail ai started";
}
